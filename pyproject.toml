[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit discovery: repo root also holds non-package dirs (alembic/, infra/,
# database/) that flat-layout auto-discovery rejects on newer setuptools.
include = ["app*"]

[project]
name = "aknja-digital"
version = "0.1.0"
description = "Aknja Digital operations and delivery platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "argon2-cffi>=23,<26",
  "jinja2>=3.1,<4",
  "email-validator>=2,<3",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pgserver>=0.1.4,<1",
  "playwright>=1.40,<2",
  "Pillow>=13,<14",
  "pip-audit>=2.9,<3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# CLI commands report any failure to the operator; password verification and
# health checks deliberately fail closed on every exception type.
"app/cli.py" = ["BLE001"]
"app/core/security.py" = ["BLE001"]
"app/main.py" = ["BLE001"]
# FastAPI's Form(...) / File(...) in argument defaults is the framework idiom
"app/ui/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: real-browser end-to-end tests (Playwright + uvicorn)"]
