[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aknja-digital"
version = "0.1.0"
description = "Aknja Digital operations and delivery platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# CLI commands report any failure to the operator; password verification and
# health checks deliberately fail closed on every exception type.
"app/cli.py" = ["BLE001"]
"app/core/security.py" = ["BLE001"]
"app/main.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
