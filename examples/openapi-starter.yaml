openapi: 3.1.0
info:
  title: Aknja Digital API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Required dependencies are ready
  /services:
    get:
      summary: List services visible to the authenticated tenant
      responses:
        '200':
          description: Service catalog page
  /projects:
    post:
      summary: Create a project
      responses:
        '201':
          description: Project created
        '403':
          description: Not authorized
