services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aknja
      POSTGRES_USER: aknja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aknja -d aknja"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aknja:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/aknja
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
volumes:
  pgdata:
