services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aknja
      POSTGRES_USER: aknja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aknja -d aknja"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aknja:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/aknja
      APP_ENV: ${APP_ENV:-local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot bootstrap: seeds, taxonomy import, super admin (idempotent).
  bootstrap:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aknja:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/aknja
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    command: >
      sh -c "python -m app.cli seed &&
             python -m app.cli import-taxonomy &&
             python -m app.cli verify-install"

volumes:
  pgdata:
